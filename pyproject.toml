[project]
name = "nirai"
version = "0.1.0"
description = "Pre-basecalling triage for nanopore sequencing from raw signal (R10.4.1+)"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scikit-learn", "pod5", "joblib"]
[project.scripts]
nirai = "nirai.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["nirai"]
